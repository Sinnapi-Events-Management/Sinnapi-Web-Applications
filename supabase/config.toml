# Sinnapi — Supabase function config.
# verify_jwt = false  -> public endpoint (webhooks / cron, protected by signature
#                        verification or service-role bearer).
# verify_jwt = true   -> requires a valid user JWT (RLS + permissions apply).

# The sign-in endpoint itself: the caller has no JWT yet, by definition. It is
# not unauthenticated in effect — it verifies the password server-side and
# refuses on its own terms (see supabase/functions/portal-sign-in).
[functions.portal-sign-in]
verify_jwt = false

# Client self-registration + confirmation resends. Must stay open to anonymous
# callers (a visitor creating an account has no JWT). Its one privileged action,
# `admin_resend`, authenticates itself in-handler against `users.manage`.
[functions.client-sign-up]
verify_jwt = false

# Password recovery, both directions. Must stay open to anonymous callers
# because `action: 'self'` is the admin portal's forgot-password form, which by
# definition has no JWT; that path is gated on a Turnstile token instead. The
# privileged `action: 'admin'` path authenticates itself in-handler against
# `users.manage` — same arrangement as client-sign-up's `admin_resend`.
[functions.send-password-reset]
verify_jwt = false

[functions.create-payment]
verify_jwt = true

[functions.psp-payout]
verify_jwt = true

[functions.psp-pesapal-webhook]
verify_jwt = false

[functions.psp-paypal-webhook]
verify_jwt = false

# Scheduled workers and the moderation hook. Open at the gateway because the
# pg_cron trigger is a service-role bearer rather than a user session — each
# handler rejects anything that is not the service-role key as its first
# statement, before it reads a row. `verify_jwt = false` on its own gates
# nothing; the in-handler check is the actual control.
[functions.fx-rate-sync]
verify_jwt = false

[functions.notification-dispatch]
verify_jwt = false

[functions.content-moderation]
verify_jwt = false

[functions.subscription-lifecycle]
verify_jwt = false

[functions.payment-reconciliation]
verify_jwt = false

[functions.escrow-lifecycle]
verify_jwt = false

[functions.vendor-application]
verify_jwt = false

[functions.promote-intake]
verify_jwt = true

# Campaign send worker. Open at the gateway because the cron trigger is a
# service-role bearer rather than a user session — the handler rejects anything
# that is not the service-role key before it touches campaign state. Its one
# non-cron action, `test`, reads the campaign through the CALLER'S client, so
# `marketing.manage` via RLS is what authorises a test send.
[functions.newsletter-dispatch]
verify_jwt = false

# Resend delivery telemetry. Public by necessity (the provider holds no JWT);
# every request is verified against the Svix signature before it is parsed, and
# a missing RESEND_WEBHOOK_SECRET fails closed.
#
# Stays deployed even when NEWSLETTER_TRANSPORT=smtp, which produces no events
# for it to receive: keeping it up means rolling back to Resend is one variable,
# and late events for campaigns sent before a swap still land.
[functions.newsletter-webhook]
verify_jwt = false

# Double opt-in confirmation, the preference centre, and RFC 8058 one-click
# unsubscribe. Must stay open to anonymous callers: a mail client POSTing a
# one-click opt-out has no session, and requiring a login to unsubscribe is the
# friction GDPR Art.7(3) exists to forbid. The capability is the 192-bit token
# in the link, which is unreachable through PostgREST.
[functions.marketing-consent]
verify_jwt = false

[functions.set-intake-status]
verify_jwt = true

# Vendor ACCOUNT lifecycle (suspend / deactivate / block / activate) and
# credential re-issue for an approved vendor who never signed in. Both are
# console-only and privileged: the gateway demands a JWT, and each handler then
# re-checks `users.manage` with the caller's own token before the service_role
# client bans a login or sets a password.
[functions.manage-vendor-account]
verify_jwt = true

[functions.resend-vendor-credentials]
verify_jwt = true

# Self-service right-of-access export. The gateway demands a JWT and the handler
# reads exclusively through the caller's own client, so RLS — not a filter we
# remembered to write — is what scopes the document to one person.
[functions.data-export]
verify_jwt = true
